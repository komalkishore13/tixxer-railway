<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings &mdash; Tixxer Railway</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar__brand">Tixxer Railway</a>
    <button class="navbar__toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="navbar__links">
      <li><a href="bookings.html" class="navbar__link">My Bookings</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="section">
      <h1 class="section__title">My Bookings</h1>
      <p class="section__subtitle">Your previously booked tickets.</p>

      <div id="bookingsList"></div>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 Tixxer Railway
  </footer>

  <script src="js/app.js"></script>
  <script>
    const list = document.getElementById('bookingsList');

    function renderBookings(bookings) {
      list.innerHTML = '';

      if (bookings.length === 0) {
        list.innerHTML =
          '<div class="booking-empty">' +
            '<p class="booking-empty__title">No bookings yet</p>' +
            '<p class="booking-empty__text">Book a train ticket to see it here.</p>' +
            '<a href="search.html" class="booking-empty__link">Search trains &rarr;</a>' +
          '</div>';
        return;
      }

      bookings.forEach(function(b) {
        const card = document.createElement('div');
        card.className = 'booking-card';

        const paxList = (b.passengers || []).map(function(p) {
          return '<span class="booking-card__pax">' + p.name + ' (' + p.age + '/' + p.gender + ')</span>';
        }).join('');

        card.innerHTML =
          '<div class="booking-card__header">' +
            '<span class="booking-card__pnr">PNR: ' + b.pnr + '</span>' +
            '<span class="booking-card__status">Confirmed</span>' +
          '</div>' +
          '<div class="booking-card__body">' +
            '<div class="booking-card__route">' +
              '<span class="booking-card__station">' + b.fromName + ' (' + b.fromCode + ')</span>' +
              '<span class="booking-card__arrow">&rarr;</span>' +
              '<span class="booking-card__station">' + b.toName + ' (' + b.toCode + ')</span>' +
            '</div>' +
            '<div class="booking-card__details">' +
              '<div class="booking-card__detail">' +
                '<span class="booking-card__label">Train</span>' +
                '<span class="booking-card__value">' + b.trainNumber + ' ' + b.trainName + '</span>' +
              '</div>' +
              '<div class="booking-card__detail">' +
                '<span class="booking-card__label">Date</span>' +
                '<span class="booking-card__value">' + b.date + '</span>' +
              '</div>' +
              '<div class="booking-card__detail">' +
                '<span class="booking-card__label">Class</span>' +
                '<span class="booking-card__value">' + b.travelClass + '</span>' +
              '</div>' +
              '<div class="booking-card__detail">' +
                '<span class="booking-card__label">Departure</span>' +
                '<span class="booking-card__value">' + b.departure + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="booking-card__passengers">' + paxList + '</div>' +
          '</div>' +
          '<div class="booking-card__footer">' +
            '<span class="booking-card__total">' + b.total + '</span>' +
            '<span class="booking-card__date">Booked on ' + b.bookedOn + '</span>' +
          '</div>';

        list.appendChild(card);
      });
    }

    // Fetch from API, fall back to localStorage
    (async function loadBookings() {
      try {
        const response = await fetch('/api/bookings');
        if (response.ok) {
          const bookings = await response.json();
          renderBookings(bookings);
          return;
        }
      } catch (err) {
        console.warn('API unavailable, falling back to localStorage:', err);
      }

      // Fallback: localStorage
      const localBookings = JSON.parse(localStorage.getItem('tixxer_bookings') || '[]');
      renderBookings(localBookings);
    })();
  </script>
</body>
</html>
