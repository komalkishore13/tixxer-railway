<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Class &mdash; Tixxer Railway</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar__brand">Tixxer Railway</a>
    <button class="navbar__toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="navbar__links">
      <li><a href="bookings.html" class="navbar__link">My Bookings</a></li>
    </ul>
  </nav>

  <div class="steps">
    <div class="steps__item"><span class="steps__number">1</span> Results</div>
    <div class="steps__divider"></div>
    <div class="steps__item steps__item--active"><span class="steps__number">2</span> Class</div>
    <div class="steps__divider"></div>
    <div class="steps__item"><span class="steps__number">3</span> Quota</div>
    <div class="steps__divider"></div>
    <div class="steps__item"><span class="steps__number">4</span> Passenger</div>
    <div class="steps__divider"></div>
    <div class="steps__item"><span class="steps__number">5</span> Payment</div>
  </div>

  <div class="page">
    <div class="section">
      <h1 class="section__title">Select your class</h1>
      <p class="section__subtitle" id="subtitle">Choose a travel class to continue.</p>

      <div class="class-list" id="classList"></div>

      <a href="#" class="class-continue" id="continueBtn">Continue &rarr;</a>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 Tixxer Railway
  </footer>

  <script src="js/app.js"></script>
  <script>
    // ─── Read train data from URL ───
    const params = new URLSearchParams(window.location.search);
    const trainNumber = params.get('train_number') || '';
    const trainName = params.get('train_name') || '';
    const fromSta = params.get('from') || '';
    const toSta = params.get('to') || '';
    const departure = params.get('departure') || '';
    const arrival = params.get('arrival') || '';
    const duration = params.get('duration') || '';
    const dateParam = params.get('date') || '';
    const classesParam = params.get('classes') || '';

    // Show train info in subtitle
    const subtitle = document.getElementById('subtitle');
    if (trainName && trainNumber) {
      subtitle.innerHTML = trainName + ' (' + trainNumber + ') &middot; ' + fromSta + ' &rarr; ' + toSta;
    }

    // Class metadata (full names and display info)
    const classInfo = {
      '1A': { name: 'First AC', code: '1A' },
      '2A': { name: 'Second AC', code: '2A' },
      '3A': { name: 'Third AC', code: '3A' },
      '3E': { name: 'Third AC Economy', code: '3E' },
      'SL': { name: 'Sleeper', code: 'SL' },
      'CC': { name: 'Chair Car', code: 'CC' },
      'EC': { name: 'Executive Chair', code: 'EC' },
      '2S': { name: 'Second Sitting', code: '2S' },
      'FC': { name: 'First Class', code: 'FC' },
      // Fallback aliases
      '1AC': { name: 'First AC', code: '1AC' },
      '2AC': { name: 'Second AC', code: '2AC' },
      '3AC': { name: 'Third AC', code: '3AC' }
    };

    // Parse available classes from URL
    const availableClasses = classesParam ? classesParam.split(',').filter(Boolean) : [];

    const list = document.getElementById('classList');
    const continueBtn = document.getElementById('continueBtn');
    let selected = null;

    if (availableClasses.length === 0) {
      list.innerHTML = '<p style="color: var(--text-secondary); padding: 2rem 0;">No class information available for this train.</p>';
    } else {
      availableClasses.forEach(function(code) {
        const info = classInfo[code] || { name: code, code: code };

        const row = document.createElement('div');
        row.className = 'class-option';
        row.innerHTML =
          '<div class="class-option__radio"></div>' +
          '<div class="class-option__info">' +
            '<span class="class-option__name">' + info.name + '</span>' +
            '<span class="class-option__code">' + code + '</span>' +
          '</div>';

        row.addEventListener('click', function() {
          document.querySelectorAll('.class-option').forEach(function(el) {
            el.classList.remove('class-option--selected');
          });
          row.classList.add('class-option--selected');
          selected = code;
          continueBtn.classList.add('class-continue--active');

          // Build quota.html link with all data carried forward
          const quotaParams = new URLSearchParams();
          quotaParams.set('train_number', trainNumber);
          quotaParams.set('train_name', trainName);
          quotaParams.set('from', fromSta);
          quotaParams.set('to', toSta);
          quotaParams.set('departure', departure);
          quotaParams.set('arrival', arrival);
          quotaParams.set('duration', duration);
          quotaParams.set('date', dateParam);
          quotaParams.set('class', selected);
          continueBtn.href = 'quota.html?' + quotaParams.toString();
        });

        list.appendChild(row);
      });
    }
  </script>
</body>
</html>
